<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Euskalmet Local · vista previa</title>
<style>body{background:#0b121d;color:#eef8ff;font-family:system-ui;margin:0;padding:20px}header{max-width:1100px;margin:auto auto 20px}header p{color:#9bb7cc;font-size:13px}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}h1{font-size:24px}euskalmet-local-card{display:block;min-width:0}mark{background:#283e42;color:#a6e6ce;padding:5px 9px;border-radius:6px}</style>
<header><h1>Euskalmet Local</h1><p><mark>VISTA PREVIA · DATOS SIMULADOS</mark></p><p>Proyecto independiente para Home Assistant · localidad, estación cercana y tarjetas incluidas</p></header><main class="grid" id="cards"></main>
<script type="module">
import {EuskalmetLocalCard} from '/euskalmet_local_static/euskalmet-local-card.js';
const now=Date.now(),loc={entry_id:'demo',locality:'Ortuella',station:'Arboleda',distance_km:4.1,latitude:43.31,longitude:-3.05,entities:{weather:'weather.demo',temperature:'sensor.demo_temperature',humidity:'sensor.demo_humidity',precipitation_today:'sensor.demo_rain'}};
const hourly=Array.from({length:24},(_,i)=>({datetime:new Date(now+i*3600000).toISOString(),temperature:12+Math.sin(i/5)*4,wind_speed:8+i%8,precipitation:i>12&&i<19?.3:0,condition:i>12&&i<19?'rainy':'partlycloudy'}));
const daily=Array.from({length:7},(_,i)=>({datetime:new Date(now+i*86400000).toISOString(),temperature:[15,18,16,21,22,18,17][i],templow:[10,11,9,9,13,11,10][i],condition:['rainy','partlycloudy','rainy','sunny','rainy','partlycloudy','rainy'][i]}));
const hass={config:{time_zone:'Europe/Madrid'},states:{'weather.demo':{state:'partlycloudy',attributes:{temperature:11.2,temperature_unit:'°C',wind_speed:8,wind_speed_unit:'km/h',humidity:null}},'sensor.demo_temperature':{state:'11.2',attributes:{observed_at:new Date().toISOString()}},'sensor.demo_humidity':{state:'unknown',attributes:{quality:'out_of_range',raw_value:101.2}},'sensor.demo_rain':{state:'3.2',attributes:{}}},callWS:async()=>[loc],connection:{subscribeMessage:async(cb,msg)=>{cb({forecast:msg.forecast_type==='daily'?daily:hourly});return ()=>{};}}};
for(const mode of ['overview','hourly','daily']){const card=document.createElement('euskalmet-local-card');card.setConfig({mode});card.hass=hass;document.querySelector('#cards').append(card);}
</script></html>
