<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eguraldi · vista previa</title>

<style>body{background:#0b121d;color:#eef8ff;font-family:system-ui;margin:0;padding:20px}header{max-width:1100px;margin:auto auto 20px}header p{color:#9bb7cc;font-size:13px}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}h1{font-size:24px}euskalmet-local-card{display:block;min-width:0}mark{background:#283e42;color:#a6e6ce;padding:5px 9px;border-radius:6px}</style>

<header><img src="studio-banner.svg" alt="Eguraldi · GOG23 Software Studio" style="display:block;width:100%;margin-bottom:20px"><h1>Eguraldi</h1><p><mark>VISTA PREVIA · DATOS SIMULADOS</mark></p><p>Proyecto independiente para Home Assistant · localidad, estación cercana y tarjetas incluidas</p></header><main class="grid" id="cards"></main>

<script type="module">

import {EuskalmetLocalCard} from '/euskalmet_local_static/euskalmet-local-card.js?v=0.10.1-controls';

const now=new Date().setMinutes(0,0,0),loc={entry_id:'demo',locality:'Ortuella',station:'Arboleda',location_source:'home_assistant',distance_km:1.8,latitude:43.31,longitude:-3.05,entities:{weather:'weather.demo',temperature:'sensor.demo_temperature',humidity:'sensor.demo_humidity',precipitation_today:'sensor.demo_rain',temperature_min_today:'sensor.demo_min',temperature_max_today:'sensor.demo_max',wind_gust_max_today:'sensor.demo_gust',irradiance:'sensor.demo_irradiance'}};

const hourly=Array.from({length:24},(_,i)=>({datetime:new Date(now+i*3600000).toISOString(),temperature:12+Math.sin(i/5)*4,wind_speed:8+i%8,precipitation:i>12&&i<19?.3:0,condition:i>12&&i<19?'rainy':'partlycloudy'}));

const daily=Array.from({length:7},(_,i)=>({datetime:new Date(now+i*86400000).toISOString(),temperature:[15,18,16,21,22,18,17][i],templow:[10,11,9,9,13,11,10][i],condition:['rainy','partlycloudy','rainy','sunny','rainy','partlycloudy','rainy'][i]}));

const statsEnd=Math.floor(Date.now()/300000)*300000;
const demoStatistics=Object.fromEntries(['sensor.demo_temperature','sensor.demo_balcony'].map((id,series)=>[id,Array.from({length:288},(_,i)=>{const value=11.2+2*(1+Math.sin(i/288*2*Math.PI-Math.PI/2))+(series?1.8+.6*Math.sin(i/288*2*Math.PI):0);return {start:statsEnd-(288-i)*300000,mean:value,min:value-.05,max:value+.05};})]));
const demoHistory={station:'C061',items:[{measureId:'temperature',dailySummaries:Array.from({length:new Date().getDate()},(_,i)=>i===6?{min:null,mean:null,max:null}:{min:7+Math.sin(i/2)*2,mean:11+Math.sin(i/2)*2,max:16+Math.sin(i/2)*3})}]};
const hass={locale:{language:new URLSearchParams(location.search).get('lang')||'es'},config:{time_zone:'Europe/Madrid'},states:{'weather.demo':{state:'partlycloudy',attributes:{temperature:11.2,temperature_unit:'°C',wind_speed:8,wind_speed_unit:'km/h',humidity:null}},'sensor.demo_balcony':{state:'13.0',attributes:{unit_of_measurement:'°C',device_class:'temperature',friendly_name:'Balcón'}},'sensor.demo_temperature':{state:'11.2',attributes:{unit_of_measurement:'°C',observed_at:new Date().toISOString()}},'sensor.demo_humidity':{state:'84.6',attributes:{}},'sensor.demo_rain':{state:'3.2',attributes:{unit_of_measurement:'mm'}},'sensor.demo_min':{state:'10.4',attributes:{unit_of_measurement:'°C'}},'sensor.demo_max':{state:'16.6',attributes:{unit_of_measurement:'°C'}},'sensor.demo_gust':{state:'22.8',attributes:{unit_of_measurement:'km/h'}},'sensor.demo_irradiance':{state:'132',attributes:{unit_of_measurement:'W/m²'}}},callWS:async msg=>msg.type==='recorder/statistics_during_period'?demoStatistics:msg.type==='euskalmet_local/history'?demoHistory:[loc],connection:{subscribeMessage:async(cb,msg)=>{if(msg.type==='subscribe_events')return ()=>{};cb({forecast:msg.forecast_type==='daily'?daily:hourly});return ()=>{};}}};

if(new URLSearchParams(location.search).get('lang')==='eu'){document.querySelector('mark').textContent='AURREBISTA · SIMULATUTAKO DATUAK';document.querySelector('header p:last-child').textContent='Home Assistanterako proiektu independentea · herria, hurbileko estazioa eta txartel integratuak';}
const view=new URLSearchParams(location.search).get('view');
if(new URLSearchParams(location.search).get('state')==='stale'){for(const kind of ['hourly','daily']){hass.states['weather.demo'].attributes['forecast_'+kind+'_stale']=true;hass.states['weather.demo'].attributes['forecast_'+kind+'_updated']=new Date(Date.now()-24*3600000).toISOString();}}

if(view==='alerts'){
 document.querySelector('.grid').style.cssText='max-width:1100px;grid-template-columns:minmax(0,1fr)';loc.entities.alert_level='sensor.demo_alert';
 const at=(offset,hour)=>{const d=new Date();d.setDate(d.getDate()+offset);d.setHours(hour,0,0,0);return d.toISOString();};
 const base={severity:'ORANGE',zone:'BIZKAIA_INTERIOR',issued:at(0,8),valid_for:at(0,0)};
 hass.states['sensor.demo_alert']={state:'orange',attributes:{alerts:[
 {...base,cause:'PERSISTENT_PRECIPITATIONS',level:'orange',starts_at:at(0,0),ends_at:at(1,0),description:'Alerta Naranja por precipitaciones persistentes desde las 00 hasta las 24 hora local. Se pueden acumular más de 80 l/m² en 24 horas en puntos de la zona. Chubascos moderados y persistentes, localmente fuertes.',descriptions_by_language:{eu:'Alerta Laranja prezipitazio iraunkorragatik. Zenbait tokitan 24 ordutan 80 l/m² baino gehiago pila daitezke. Zaparrada ertain eta iraunkorrak, zenbait tokitan handiak.'}},
 {...base,cause:'WIND_ON_EXPOSED_ZONES',level:'yellow',starts_at:at(0,0),ends_at:at(1,0),description:'Aviso Amarillo por viento en zonas expuestas desde las 00 hasta las 24 hora local. Las rachas pueden superar los 100 km/h en zonas expuestas.',descriptions_by_language:{eu:'Abisu Horia haizeagatik haizeguneetan. Haize-boladek 100 km/h-ko abiadura gaindi dezakete haizeguneetan.'}},
 {...base,cause:'PERSISTENT_PRECIPITATIONS',level:'orange',valid_for:at(1,0),starts_at:at(1,0),ends_at:at(1,9),description:'Alerta Naranja por precipitaciones persistentes desde las 00 hasta las 09 hora local. La lluvia puede continuar durante la madrugada.',descriptions_by_language:{eu:'Alerta Laranja prezipitazio iraunkorragatik. Goizaldean euria egiten jarrai dezake.'}},
 ]}};
}
if(view==='day_summary'){document.querySelector('.grid').style.cssText='max-width:900px;grid-template-columns:minmax(0,1fr)';loc.entities.alert_level='sensor.demo_alert';hass.states['sensor.demo_alert']={state:'none',attributes:{alerts:[]}};Object.assign(hass.states['weather.demo'].attributes,{alerts_updated:new Date().toISOString(),alerts_stale:false});for(let i=0;i<hourly.length;i++){hourly[i].temperature=19;hourly[i].humidity=60;hourly[i].precipitation=i<8?0:1;hourly[i].condition=i<8?'partlycloudy':'rainy';}daily[1].condition='sunny';daily[2].condition='partlycloudy';if(new URLSearchParams(location.search).get('state')==='stale')hass.states['weather.demo'].attributes.alerts_stale=true;}
if(view==='vehicle_wash'){document.querySelector('.grid').style.cssText='max-width:960px;grid-template-columns:minmax(0,1fr)';['rainy','partlycloudy','sunny','cloudy','rainy','partlycloudy','rainy'].forEach((condition,i)=>daily[i].condition=condition);}
if(view==='outing'){document.querySelector('.grid').style.cssText='max-width:760px;grid-template-columns:minmax(0,1fr)';for(let i=0;i<hourly.length;i++){hourly[i].temperature=i<6?18-i*.3:12;hourly[i].wind_speed=i<6?8:24;hourly[i].precipitation=i>=6?.6:0;hourly[i].condition=i>=6?'rainy':'partlycloudy';}if(new URLSearchParams(location.search).get('state')==='missing')for(const f of hourly)delete f.precipitation;}
if(view==='drying'){
  loc.entities.laundry_out='switch.demo_laundry';
  hass.states['switch.demo_laundry']={entity_id:'switch.demo_laundry',state:'off',attributes:{alerts_enabled:false,monitoring_status:'disabled'}};
  hass.callService=async(domain,service,data)=>{if(domain==='switch'&&data.entity_id==='switch.demo_laundry'){const state=hass.states['switch.demo_laundry'];state.state=service==='turn_on'?'on':'off';state.attributes.monitoring_status=state.state==='on'?'watching':'idle';for(const card of document.querySelectorAll('euskalmet-local-card'))card.hass={...hass};}};
  const laundryFields=[['laundry_enabled',false],['laundry_target',''],['laundry_lead_minutes','30'],['laundry_rain',true],['laundry_wind',true],['laundry_wind_kmh',30],['laundry_start','08:00:00'],['laundry_end','22:00:00'],['laundry_cooldown_minutes','120']].map(([name,value])=>({name,default:value,...(['laundry_target','laundry_lead_minutes','laundry_cooldown_minutes'].includes(name)?{selector:{select:{options:name==='laundry_target'?[{value:'',label:'Selecciona un destino'},{value:'persistent_notification',label:'Home Assistant'}]:name==='laundry_lead_minutes'?['15','30','60']:['30','60','120','240']}}}:{})}));
  hass.callApi=async(method,path,data)=>{if(method==='DELETE')return {};if(path.endsWith('/flow')||data?.next_step_id)return {type:'form',step_id:'laundry',flow_id:'demo-laundry',data_schema:laundryFields};const state=hass.states['switch.demo_laundry'];state.attributes.alerts_enabled=data.laundry_enabled;state.attributes.monitoring_status=data.laundry_enabled?'idle':'disabled';for(const card of document.querySelectorAll('euskalmet-local-card'))card.hass={...hass};return {type:'create_entry'};};
  if(new URLSearchParams(location.search).get('alerts')==='enabled')hass.states['switch.demo_laundry'].attributes={alerts_enabled:true,monitoring_status:'idle'};

  document.querySelector('.grid').style.cssText='max-width:760px;grid-template-columns:minmax(0,1fr)';
  for(let i=0;i<hourly.length;i++){hourly[i].temperature=15+6*Math.max(0,Math.sin(i/24*Math.PI));hourly[i].humidity=80-25*Math.max(0,Math.sin(i/24*Math.PI));hourly[i].wind_speed=i===5?36:8+i%9;hourly[i].precipitation=i<3?.3:0;hourly[i].condition=i<3?'rainy':'partlycloudy';}
  if(new URLSearchParams(location.search).get('state')==='limited')for(const f of hourly)delete f.humidity;
}
if(view==='microclimate'){
  const learning=new URLSearchParams(location.search).get('state')==='learning';
  loc.microclimate_enabled=true;loc.entities.microclimate_status='sensor.demo_micro';
  const hourly=Array.from({length:24},(_,hour)=>({hour,correction:Math.round((.6+1.6*Math.max(0,Math.sin((hour-6)/24*2*Math.PI)))*10)/10,samples:42,method:'hourly'}));
  const validationStart=new Date().setHours(0,0,0,0)/1000-2*86400;
  const validationSeries=Array.from({length:48},(_,i)=>{const reference=12+2*Math.sin(i/24*2*Math.PI),correction=.6+1.6*Math.max(0,Math.sin((i%24-6)/24*2*Math.PI));return {timestamp:validationStart+i*3600,reference,outdoor:reference+correction+.45*Math.sin(i*.8),adjusted:reference+correction};}).filter((p,i)=>i!==10&&i!==11);
  const mae=rows=>({baseline_mae:rows.reduce((n,p)=>n+Math.abs(p.outdoor-p.reference),0)/rows.length,adjusted_mae:rows.reduce((n,p)=>n+Math.abs(p.outdoor-p.adjusted),0)/rows.length});
  const errors=mae(validationSeries),dailyErrors=[0,1].map(day=>{const rows=validationSeries.filter(p=>p.timestamp>=validationStart+day*86400&&p.timestamp<validationStart+(day+1)*86400);return {date:new Date((validationStart+day*86400+43200)*1000).toISOString().slice(0,10),hours:rows.length,...mae(rows),improved:true};});
  hass.states['sensor.demo_micro']={state:learning?'learning':'validated',attributes:{since:new Date(Date.now()-(learning?5:14)*86400000).toISOString(),sensor_name:'Balcón',paired_hours:learning?90:316,days:learning?5:14,coverage_percent:learning?75:94,training_hours:learning?54:260,training_days:learning?3:12,validation_days:2,validation_hours:learning?36:46,validation_series:learning?[]:validationSeries,validation_daily:learning?[]:dailyErrors,validation_checks:learning?{}:{absolute_gain:true,relative_gain:true,each_day:true},outdoor_temperature:14.6,reference_temperature:12.8,current_difference:1.8,estimate:learning?null:14.4,baseline_mae:learning?null:errors.baseline_mae,adjusted_mae:learning?null:errors.adjusted_mae,improvement_percent:learning?null:(errors.baseline_mae-errors.adjusted_mae)/errors.baseline_mae*100,error_p90:learning?null:.8,hourly:learning?hourly.map(b=>({...b,correction:1.3,samples:11,method:"global"})):hourly,periods:{day:{bias:1.9,samples:learning?45:126},night:{bias:.7,samples:learning?45:190}}}};
  document.querySelector('.grid').style.cssText='max-width:650px;grid-template-columns:minmax(0,1fr)';
}

// Public demo coordinates identify the town, never a Home Assistant home location.
if(view==='radar'){
  loc.entities.radar='camera.demo_radar';
  hass.states['camera.demo_radar']={state:'idle',attributes:{config_entry_id:'demo',frame_count:3,timestamp:new Date(now).toISOString(),bounds:[[43.1,-3.4],[43.5,-2.6]]}};
  const demoFrames=Array.from({length:3},(_,i)=>({timestamp:new Date(now-(2-i)*600000).toISOString()}));
  const otherWS=hass.callWS;
  hass.callWS=async msg=>{
    if(msg.type!=='euskalmet_local/radar_frames')return otherWS(msg);
    if(msg.index===undefined)return {frames:demoFrames};
    const offset=msg.index*30;
    const image=`<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"><g transform="translate(${offset},0)" opacity=".5"><path fill="#29dd15" d="M-100 180 Q90 0 230 120T490 220T780 260L800 390Q550 300 460 320T200 260T-100 330Z"/><path fill="#08fdf9" d="M-100 215Q70 110 210 180T450 270T780 300L790 345Q550 290 430 300T190 220T-100 290Z"/></g></svg>`;
    return {image:btoa(image),content_type:'image/svg+xml'};
  };
}
if(view==='forecasts')document.querySelector('.grid').style.gridTemplateColumns='minmax(0,1fr)';
if(view==='radar')document.querySelector('.grid').style.cssText='max-width:650px;grid-template-columns:minmax(0,1fr)';
for(const mode of (view==='editor'?[]:view==='alerts'?['alerts']:view==='radar'?['radar']:view==='summaries'?['summaries']:view==='drying'?['drying']:view==='outing'?['outing']:view==='day_summary'?['day_summary']:view==='vehicle_wash'?['vehicle_wash']:view==='microclimate'?['microclimate']:view==='forecasts'?['hourly_chart','daily_tiles','planning']:view==='charts'?['comparison','history']:['overview','hourly','daily'])){const card=document.createElement('euskalmet-local-card');card.setConfig({mode,...(mode==='alerts'?{alerts_view:new URLSearchParams(location.search).get('style')||'list'}:{}),...(mode==='radar'?{autoplay:false}:{}),...(mode==='comparison'?{comparison_entity:'sensor.demo_balcony',comparison_name:'Balcón'}:{})});card.hass=hass;document.querySelector('#cards').append(card);}

if(new URLSearchParams(location.search).get('view')==='editor'){

  document.querySelector('.grid').style.cssText='max-width:800px;grid-template-columns:1fr 1fr';

  const editor=document.createElement('euskalmet-local-editor');

  editor.style.cssText='display:block;background:#132331;padding:20px;border-radius:20px;--card-background-color:#132331;--primary-text-color:#eef8ff;--secondary-text-color:#9bb7cc;--divider-color:#385269';

  editor.setConfig({type:'custom:euskalmet-local-card',mode:'radar',entry_id:'demo',zoom:10});editor.hass=hass;

  document.querySelector('#cards').append(editor);

  const description=document.createElement('div');description.innerHTML='<h2>Editor visual</h2><p>Personaliza la vista y la localidad. En Tu día, elige los bloques, su orden y tus preferencias.</p><p>Las tarjetas muestran tu localidad y, en pequeño, la estación utilizada y su distancia.</p>';

  if(new URLSearchParams(location.search).get('lang')==='eu')description.innerHTML='<h2>Ikusizko editorea</h2><p>Pertsonalizatu ikuspegia eta herria. Zure egunean, aukeratu blokeak, ordena eta lehentasunak.</p><p>Txartelek zure herria erakusten dute eta, txikiago, erabilitako estazioa eta haren distantzia.</p>';
  document.querySelector('#cards').append(description);

}

</script></html>
