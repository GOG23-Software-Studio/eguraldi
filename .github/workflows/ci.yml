name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: ruff check custom_components tests
      - run: python -m pytest
      - run: npm ci --ignore-scripts
      - run: npm test
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install homeassistant==2026.11.1 pytest
      - run: python -c "import custom_components.euskalmet_local; import custom_components.euskalmet_local.config_flow; import custom_components.euskalmet_local.sensor; import custom_components.euskalmet_local.weather"
      - run: python -m pytest tests/test_ha_smoke.py
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
      - uses: home-assistant/actions/hassfest@master
