name: Release package
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import json,os; v=json.load(open('custom_components/euskalmet_local/manifest.json'))['version']; assert os.environ['RELEASE_TAG']=='v'+v"
      - run: python tools/build_release.py
      - name: Attach package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/eguraldi-*.zip dist/eguraldi-*.zip.sha256 --clobber
